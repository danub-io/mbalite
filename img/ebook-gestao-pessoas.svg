      <stop offset="0" stop-color="#0A1128"/>
      <stop offset="1" stop-color="#1A2A4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#2A7DE1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2A7DE1" stop-opacity="0"/>
