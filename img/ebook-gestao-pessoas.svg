    <rect x="22" y="76" width="52" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="90" y="54" width="44" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="90" y="78" width="36" height="8" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- marca -->
  <rect x="48" y="46" width="56" height="6" rx="3" fill="#2A7DE1"/>
  <text x="48" y="94" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">MBA<tspan fill="#2A7DE1">lite</tspan></text>

